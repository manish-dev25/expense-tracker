<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Expense Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>💰 Expense Analyzer</h1>
    <p>Track income, expenses & monthly savings</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>Monthly Income</h2>
      <div class="field">
        <label>Total Monthly Income (₹)</label>
        <input type="number" id="income" placeholder="e.g. 50000" min="0">
      </div>
    </div>

    <div class="card">
      <h2>Monthly Expenses</h2>
      <div class="expense-list" id="expenseList"></div>
      <button class="btn-add" onclick="addExpense()">+ Add Expense</button>
    </div>

    <button class="btn-calculate" onclick="calculate()">Calculate Budget →</button>

    <div class="card" id="results">
      <h2>Summary</h2>

      <div id="statusBadge"></div>

      <div class="summary-grid">
        <div class="summary-item">
          <div class="label">Total Income</div>
          <div class="value" id="rIncome">—</div>
        </div>
        <div class="summary-item">
          <div class="label">Total Expenses</div>
          <div class="value" id="rExpenses">—</div>
        </div>
        <div class="summary-item full">
          <div class="label">Monthly Savings</div>
          <div class="value" id="rSavings" style="font-size:1.3rem">—</div>
        </div>
      </div>

      <div class="breakdown-title">Expense Breakdown</div>
      <div id="breakdown"></div>
      <p class="savings-note" id="savingsNote"></p>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
